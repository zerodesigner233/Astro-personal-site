name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || 'https://pub-0e8b2f3d84ed4442bac9e16d61465b6c.r2.dev' }}
  R2_PATH_PREFIX: ${{ vars.R2_PATH_PREFIX || 'Cloudfare/website' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upload media to R2 (skip if secrets not set)
        run: |
          if [ -n "${{ secrets.R2_ACCOUNT_ID }}" ] && [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" ]; then
            npm run upload-media
          else
            echo "R2 secrets not configured, skipping media upload"
          fi
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'my-portfolio-media' }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || 'https://pub-0e8b2f3d84ed4442bac9e16d61465b6c.r2.dev' }}
          R2_PATH_PREFIX: ${{ vars.R2_PATH_PREFIX || 'Cloudfare/website' }}
      - run: npm run build
        env:
          BASE_PATH: /Astro-personal-site
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || 'https://pub-0e8b2f3d84ed4442bac9e16d61465b6c.r2.dev' }}
          R2_PATH_PREFIX: ${{ vars.R2_PATH_PREFIX || 'Cloudfare/website' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
